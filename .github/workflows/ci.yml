name: CI

# The fact-verification gauntlet runs here on every change. A PR cannot go green
# — and therefore cannot merge under branch protection — if any published fact
# fails a gate, a verification test fails, or the build/typecheck breaks.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify facts, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify every published fact clears the gauntlet
        run: npm run verify:facts

      - name: Run verification test suite
        run: npm test

      - name: Build (typecheck + static generation)
        run: npm run build
